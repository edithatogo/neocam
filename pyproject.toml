[project]
name = "panda-vision-evaluation"
version = "6.0.0"
description = "Preliminary neonatal economic model with explicit evidence and developer assurance"
requires-python = ">=3.13,<3.16"
dependencies = ["numpy==2.5.4"]

[project.optional-dependencies]
# No dataframe package is needed for the small CSV model. This extra provides
# an independent tabular reconciliation; Polars is the only supported engine.
tabular = ["polars==2.1.0"]
# Offline explanatory sensitivity tools, not required by the exact model kernel.
research = ["scipy==1.18.1", "scikit-learn==1.9.1"]

[dependency-groups]
test = ["pytest==9.1.1", "coverage==7.17.0"]
assurance = [
  {include-group = "test"},
  "ruff==0.17.3", "ty==0.0.92", "basedpyright==1.40.2",
  "hypothesis==6.170.12", "pytest-gremlins==1.12.2", "scalene==2.4.0",
  "pip-audit==2.10.1", "uv==0.13.6",
  "prek==0.5.7", "zizmor==1.31.1",
]

feedback = ["pytest-testmon==2.2.0", "pytest-xdist==3.8.0"]

[tool.uv]
package = false
# Do not refresh resolutions during ordinary CI. uv.lock must be generated
# in an explicit maintenance step and reviewed, then frozen-sync everywhere.
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src", "quality"]
# The optional tools are executed by their dedicated full gates, not asserted
# covered by the ordinary unit suite. List scope exclusions explicitly.
omit = ["quality/hypothesis_properties.py", "quality/polars_probe.py", "quality/profile_workload.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
precision = 2

[tool.ruff]
required-version = "==0.17.3"
target-version = "py313"
line-length = 120
preview = true
unsafe-fixes = false
extend-exclude = ["extensions", ".venv", ".tools", "outputs", "verification"]

[tool.ruff.lint]
select = ["ALL"]
explicit-preview-rules = false
# Only documented formatter conflicts are disabled globally.
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# Assertions and literal expected values are deliberate in tests.
"tests/*.py" = ["S101", "PLR2004"]
"quality/hypothesis_properties.py" = ["S101", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
docstring-code-format = true
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "quality", "tests", "scripts/run_v2.py", "scripts/verify.py", "scripts/analyse_v5.py", "scripts/analyse_v6.py"]

[tool.ty.rules]
all = "error"

[tool.basedpyright]
include = ["src", "quality", "tests", "scripts/run_v2.py", "scripts/verify.py", "scripts/analyse_v5.py", "scripts/analyse_v6.py"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "all"
failOnWarnings = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
strictGenericNarrowing = true
# Experimental language semantics are not needed for this numerical model.
enableExperimentalFeatures = false

[tool.pytest-gremlins]
paths = ["src/pathways_v6.py", "src/statewide.py", "src/strategies.py", "src/sensitivity.py", "quality/contracts.py", "quality/assurance.py"]
operators = ["comparison", "arithmetic", "boolean", "boundary", "return"]
report = ["console", "html", "json"]
cache = false
workers = 2
max_pardons = 0
max-pardons-pct = 0.0
