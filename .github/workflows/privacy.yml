name: Personal identifier gate
# Secret scanning finds credentials; this gate finds personal and patient identifiers in
# tracked content and in the readable parts of generated documents. It runs beside the
# assurance suite, never as a replacement for it, and it runs on every pull request so a
# leaked identifier cannot reach a public branch unnoticed.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panda-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  privacy:
    name: Personal identifier scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15'
          # Package cache only on trusted non-PR events; never cache a virtualenv or acceptance receipt.
          enable-cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: uv.lock
      - name: Install the frozen assurance environment
        run: uv sync --frozen --group assurance
      - name: Reject personal identifiers in tracked content
        run: uv run --frozen --no-sync python -m quality.privacy --output verification/privacy.json
      - name: Prove the scan still fails on a synthetic identifier fixture
        run: uv run --frozen --no-sync python -m pytest tests/test_privacy_scan.py -q -p no:cacheprovider
      - name: Retain the privacy receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privacy-receipt-${{ github.sha }}
          path: verification/privacy.json
          if-no-files-found: error
          retention-days: 14
