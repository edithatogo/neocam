name: Import complete verified repository
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
concurrency:
  group: neocam-verified-import
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.repository == 'edithatogo/neocam' &&
      github.event.repository.private == true &&
      github.actor == 'edithatogo' &&
      github.event.issue.user.login == 'edithatogo' &&
      github.event.issue.title == 'neocam: complete repository import'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Fetch trusted importer and import checksum-verified private archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github.raw+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/scripts/import_repository.py?ref=$GITHUB_SHA" \
            --output "$RUNNER_TEMP/import_repository.py"
          python3 "$RUNNER_TEMP/import_repository.py"
