name: Model and evidence assurance
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-model:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14', '3.15']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve direct pins to an auditable per-run hash lock
        run: |
          python -m pip install uv==0.13.5
          uv pip compile requirements-latest.in --generate-hashes --output-file requirements-resolved.txt
          uv pip sync --system --require-hashes requirements-resolved.txt
      - name: Lint model and analysis entrypoint
        run: ruff check src scripts/run_v2.py scripts/verify.py
      - name: Tests and core branch coverage
        run: |
          coverage run --branch --source=src.statewide -m pytest -q
          coverage report --fail-under=95
          coverage xml -o verification/coverage.xml
      - name: Generative property tests
        run: python -m pytest quality/property_hypothesis.py -q
      - name: Data, context, reproducibility and artifact contract
        run: python scripts/verify.py --ci
      - name: Vulnerability audit and SBOM
        run: pip-audit -r requirements-resolved.txt -f cyclonedx-json -o verification/dependency-sbom.json
      - name: Preserve verification receipts, never confidential templates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            verification/
            requirements-resolved.txt
          retention-days: 30
          if-no-files-found: error
  conductor-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Verify exact submodule commit and working tree
        run: |
          test -f extensions/conductor/README.md
          test "$(git -C extensions/conductor rev-parse HEAD)" = 137c1e41ff9c1dc75ff277b9582460a0bd8c4768
          git submodule status
