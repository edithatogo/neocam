name: Model and full developer assurance
on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: panda-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-matrix:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14', '3.15']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned resolver and frozen reviewed dependencies
        run: |
          python -m pip install uv==0.13.6
          test -f uv.lock
          uv sync --frozen --group test
      - name: Same quick model checks as local development
        run: uv run --frozen --group test python -m quality.cli --profile quick
      - name: Preserve scoped receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-${{ matrix.python }}-${{ github.sha }}
          path: verification/v3/quick/
          if-no-files-found: error
          retention-days: 14
  full-assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install complete frozen toolchain
        run: |
          python -m pip install uv==0.13.6
          test -f uv.lock
          uv sync --frozen --group assurance --extra tabular
          uv run --frozen --group assurance --extra tabular python -m quality.bootstrap
      - name: Run exactly the local full gate set
        run: uv run --frozen --group assurance --extra tabular python -m quality.cli --profile full
      - name: Preserve evidence including failures; never private clinical templates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-assurance-${{ github.sha }}
          path: |
            verification/v3/full/
            verification/v3/scalene.json
            verification/v3/gitleaks-*.json
            verification/v3/pip-audit.json
            verification/v3/sbom.json
            coverage/gremlins/
            uv.lock
          if-no-files-found: error
          retention-days: 14
