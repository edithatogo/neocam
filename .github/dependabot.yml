version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      developer-assurance:
        patterns:
          - ruff
          - ty
          - basedpyright
          - pytest*
          - coverage
          - hypothesis
          - scalene
# Review and test update PRs; no auto-merge and no dependency mutation on normal CI.
